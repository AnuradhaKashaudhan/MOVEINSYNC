name: Weekly Play Store Ratings Intelligence Pipeline

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline end-to-end
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run_all.py

      - name: Upload HTML report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ratings-report-html
          path: reports/ratings_report.html
          retention-days: 30

      - name: Commit updated rating snapshots & summary
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/processed/rating_history.csv reports/summary.json reports/ratings_report.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(pipeline): automated weekly rating snapshot and report update" && git push)
